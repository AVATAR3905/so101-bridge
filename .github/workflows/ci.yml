name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install websockets aiohttp numpy opencv-python-headless
          pip install feetech-servo-sdk==1.0.0
          pip install mujoco
      - name: Start bridge in sim mode
        run: |
          SO101_SIM_MODE=mujoco python server.py > bridge.log 2>&1 &
          echo "server started"
      - name: Run sim tests
        run: python test_sim_mode.py
      - name: Show bridge log on failure
        if: failure()
        run: cat bridge.log
